name: Build and commit dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Copy manifest into dist
        run: cp manifest.json dist/manifest.json

      - name: Commit generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No dist changes to commit."
          else
            git commit -m "Build extension dist [skip ci]"
            git push
          fi
