name: Build DevToolsUB Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/background.js
          test -f dist/content.js
          test -f dist/devtools.js
          test -f dist/popup.js
          test -f dist/ui/devtools.html
          test -f dist/ui/popup.html
          test -f dist/assets/devtools.css

      - name: Create extension package
        run: |
          rm -rf release
          mkdir -p release
          cp manifest.json release/manifest.json
          cp -R dist release/dist
          cd release
          zip -r ../DevToolsUB-extension.zip manifest.json dist

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DevToolsUB-extension
          path: DevToolsUB-extension.zip
          if-no-files-found: error

      - name: Upload built dist
        uses: actions/upload-artifact@v4
        with:
          name: DevToolsUB-dist
          path: dist
          if-no-files-found: error
