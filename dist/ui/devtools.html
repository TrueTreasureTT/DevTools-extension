<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DevToolsUB</title>
  <script type="module" crossorigin src="/devtools.js"></script>
  <link rel="modulepreload" crossorigin href="/chunks/messaging.js">
  <link rel="modulepreload" crossorigin href="/chunks/modulepreload-polyfill.js">
  <link rel="stylesheet" crossorigin href="/assets/devtools.css">
</head>
<body>
  <div class="devtools">
    <header class="top-bar">
      <div class="brand">DevToolsUB</div>
      <button id="select-element" title="Select element">↖</button>
      <nav id="main-tabs">
        <button class="active" data-panel="elements">Elements</button>
        <button data-panel="console">Console</button>
        <button data-panel="sources">Sources</button>
        <button data-panel="network">Network</button>
        <button data-panel="performance">Performance</button>
        <button data-panel="application">Application</button>
        <button data-panel="security">Security</button>
      </nav>
      <div class="status-wrap">
        <span id="status">Connecting…</span>
        <button id="close">×</button>
      </div>
    </header>

    <main>
      <aside class="elements">
        <h3>DOM</h3>
        <input id="filter" placeholder="Filter elements" autocomplete="off">
        <div id="element-tree">Loading…</div>
      </aside>

      <section class="center">
        <div class="tabs" id="sub-tabs">
          <button class="active" data-sub="styles">Styles</button>
          <button data-sub="computed">Computed</button>
          <button data-sub="layout">Layout</button>
          <button data-sub="events">Event Listeners</button>
        </div>
        <div class="tools">
          <button id="hov">:hov</button>
          <button id="cls">.cls</button>
          <button id="add">+</button>
          <button id="color">🎨</button>
        </div>
        <pre id="output">Loading page information…</pre>
      </section>

      <aside class="box">
        <h3>Box Model</h3>
        <div id="box-model">Select an element</div>
      </aside>
    </main>
  </div>

  <!-- MV3 blocks inline JavaScript, so the real JS lives in src/devtools.ts and is bundled by Vite. -->
</body>
</html>
