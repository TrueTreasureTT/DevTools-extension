<!doctype html><html><head><meta charset="UTF-8"><title>DevToolsUB</title></head><body><button id="open">Open DevTools</button><script type="module">document.querySelector('#open').addEventListener('click', async () => { const tab = (await chrome.tabs.query({active:true,currentWindow:true}))[0]; if (tab?.id) await chrome.windows.create({url: chrome.runtime.getURL(`ui/devtools.html?tabId=${tab.id}`), type:'popup', width:1200, height:800}); window.close(); });</script></body></html>
